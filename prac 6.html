<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #dbeafe, #fce7f3);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 350px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px gray;
        }

        h1 {
            text-align: center;
            color: #4f46e5;
        }

        p {
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 8px;
            display: none;
        }

        #result h2 {
            color: #4f46e5;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Grade Calculator</h1>

        <p>Enter marks of 5 subjects</p>

        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter name">

        <label>Subject 1</label>
        <input type="number" id="m1" placeholder="Enter marks">

        <label>Subject 2</label>
        <input type="number" id="m2" placeholder="Enter marks">

        <label>Subject 3</label>
        <input type="number" id="m3" placeholder="Enter marks">

        <label>Subject 4</label>
        <input type="number" id="m4" placeholder="Enter marks">

        <label>Subject 5</label>
        <input type="number" id="m5" placeholder="Enter marks">

        <button onclick="calculateGrade()">Calculate Result</button>

        <div id="error" class="error"></div>

        <div id="result">
            <h2>Result</h2>

            <p id="studentName"></p>
            <p id="total"></p>
            <p id="percentage"></p>
            <p id="grade"></p>
            <p id="status"></p>
        </div>

    </div>


    <script>

        function calculateGrade() {

            // Get student name
            let name = document.getElementById("name").value;

            // Get marks and convert them into numbers
            let m1 = parseFloat(document.getElementById("m1").value);
            let m2 = parseFloat(document.getElementById("m2").value);
            let m3 = parseFloat(document.getElementById("m3").value);
            let m4 = parseFloat(document.getElementById("m4").value);
            let m5 = parseFloat(document.getElementById("m5").value);

            // Check input
            if (
                name == "" ||
                isNaN(m1) ||
                isNaN(m2) ||
                isNaN(m3) ||
                isNaN(m4) ||
                isNaN(m5)
            ) {
                document.getElementById("error").innerHTML =
                    "Please enter all details.";

                document.getElementById("result").style.display = "none";

                return;
            }

            // Check marks between 0 and 100
            if (
                m1 < 0 || m1 > 100 ||
                m2 < 0 || m2 > 100 ||
                m3 < 0 || m3 > 100 ||
                m4 < 0 || m4 > 100 ||
                m5 < 0 || m5 > 100
            ) {
                document.getElementById("error").innerHTML =
                    "Marks should be between 0 and 100.";

                document.getElementById("result").style.display = "none";

                return;
            }

            // Calculate total
            let total = m1 + m2 + m3 + m4 + m5;

            // Calculate percentage
            let percentage = (total / 500) * 100;

            // Calculate grade
            let grade;

            if (percentage >= 90) {
                grade = "A+";
            }
            else if (percentage >= 80) {
                grade = "A";
            }
            else if (percentage >= 70) {
                grade = "B";
            }
            else if (percentage >= 60) {
                grade = "C";
            }
            else if (percentage >= 50) {
                grade = "D";
            }
            else {
                grade = "F";
            }

            // Pass or Fail
            let status;

            if (percentage >= 40) {
                status = "PASS";
            }
            else {
                status = "FAIL";
            }

            // Display result
            document.getElementById("error").innerHTML = "";

            document.getElementById("studentName").innerHTML =
                "Student Name: " + name;

            document.getElementById("total").innerHTML =
                "Total Marks: " + total + " / 500";

            document.getElementById("percentage").innerHTML =
                "Percentage: " + percentage.toFixed(2) + "%";

            document.getElementById("grade").innerHTML =
                "Grade: " + grade;

            document.getElementById("status").innerHTML =
                "Status: " + status;

            document.getElementById("result").style.display = "block";
        }

    </script>

</body>

</html>
