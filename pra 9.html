<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal To-Do List(CM25023)</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-purple-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-6 rounded-lg shadow-lg w-96">

        <h1 class="text-2xl font-bold text-center text-purple-600 mb-4">
            Personal To-Do List
        </h1>

        <div class="flex gap-2 mb-4">
            <input
                id="taskInput"
                type="text"
                placeholder="Enter task"
                class="border p-2 rounded w-full"
            >

            <button
                onclick="addTask()"
                class="bg-purple-500 text-white px-4 rounded">
                Add
            </button>
        </div>

        <ul id="taskList"></ul>

    </div>

    <script>
        function addTask() {

            let input = document.getElementById("taskInput");
            let task = input.value;

            if (task === "") {
                alert("Please enter a task");
                return;
            }

            let li = document.createElement("li");

            li.className =
                "flex justify-between items-center bg-gray-100 p-2 mb-2 rounded";

            li.innerHTML = `
                <span onclick="completeTask(this)" class="cursor-pointer">
                    ${task}
                </span>

                <button
                    onclick="deleteTask(this)"
                    class="bg-red-500 text-white px-2 py-1 rounded">
                    Delete
                </button>
            `;

            document.getElementById("taskList").appendChild(li);

            input.value = "";
        }

        function completeTask(task) {
            task.classList.toggle("line-through");
            task.classList.toggle("text-gray-400");
        }

        function deleteTask(button) {
            button.parentElement.remove();
        }
    </script>

</body>
</html>
